name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q BattleShipPort-main.zip
          rm BattleShipPort-main.zip
          rm -rf BattleShip-main/.github
          cp -a BattleShip-main/. .
          rm -rf BattleShip-main
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack BattleShipPort"
          git push
