name: Build Android (BattleShipPort)

# Builds the BattleShipPort sideload APK(s) on GitHub Actions.
#   - Push / PR to main          -> APKs uploaded as workflow artifacts
#   - Manual run (Actions tab)   -> same
#   - Tag v*                     -> APKs are also attached to a GitHub Release
#
# No ROM is ever bundled. Users pick their own US SSB64 .z64 on first launch.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the tag -> Release step

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: BattleShipPort (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            apk_name: BattleShipPort-arm64-v8a.apk
          - abi: armeabi-v7a
            apk_name: BattleShipPort-armeabi-v7a.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uploading a zip through the GitHub website does NOT keep git
      # submodules, so the three dependency repos are cloned here instead.
      # (URLs/branches are the ones from .gitmodules.)
      - name: Clone dependencies (libultraship, torch, decomp)
        run: |
          rm -rf libultraship torch decomp
          git clone --depth 1 --recursive -b ssb64        https://github.com/JRickey/libultraship.git libultraship
          git clone --depth 1 --recursive -b ssb64        https://github.com/JRickey/Torch.git        torch
          git clone --depth 1 --recursive -b port-patches https://github.com/JRickey/ssb-decomp-re.git decomp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Pillow (CSS asset baking during CMake configure)
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Install Android SDK + NDK r29
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate f3d.o2r (Fast3D shaders bundled in the APK)
        working-directory: libultraship/src/fast
        run: cmake -E tar cf "$GITHUB_WORKSPACE/f3d.o2r" --format=zip shaders

      - name: Decode release keystore (optional)
        env:
          KS_B64:  ${{ secrets.SSB64_ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SSB64_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SSB64_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SSB64_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::No keystore secret set - APK will be debug-signed (still installs fine)."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "SSB64_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/release.jks"
            echo "SSB64_RELEASE_KEYSTORE_PASSWORD=$KS_PASS"
            echo "SSB64_RELEASE_KEY_ALIAS=$KS_ALIAS"
            echo "SSB64_RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pssb64.abis=${{ matrix.abi }}

      - name: Stage APK
        run: |
          mkdir -p dist
          shopt -s nullglob
          apk=(android/app/build/outputs/apk/release/app-release*.apk)
          if (( ${#apk[@]} == 0 )); then
            echo "::error::No APK produced"; ls -la android/app/build/outputs/apk/release/ || true; exit 1
          fi
          cp "${apk[0]}" "dist/${{ matrix.apk_name }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: BattleShipPort-${{ matrix.abi }}
          path: dist/${{ matrix.apk_name }}
          if-no-files-found: error

  release:
    name: Attach APKs to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BattleShipPort ${{ github.ref_name }} (by KhalilXmodz)
          files: artifacts/*.apk
